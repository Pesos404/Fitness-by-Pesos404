<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F7B6C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bilanz">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Bilanz – Kalorien- und Nährwert-Tagebuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F1;--surf:#fff;--ink:#17212B;--mut:#5B6B73;--line:#D5DEDC;--acc:#0F7B6C;--onacc:#fff;--p:#C8423B;--c:#D99A2B;--f:#3F6BB0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1E;--surf:#17252B;--ink:#E6EFEE;--mut:#93A6AC;--line:#27393F;--acc:#3FBFA9;--onacc:#0F1A1E;--p:#EE7A72;--c:#EBB85A;--f:#7FA3DD;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A1E;--surf:#17252B;--ink:#E6EFEE;--mut:#93A6AC;--line:#27393F;--acc:#3FBFA9;--onacc:#0F1A1E;--p:#EE7A72;--c:#EBB85A;--f:#7FA3DD;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:8px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 auto 0 0}
h2{font-size:17px;font-weight:600;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.pri{background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.dn{display:flex;align-items:center;margin:14px 0 8px}
.dn button{background:none;border:0;padding:6px 14px;font-size:22px}
.dn #today{flex:1;font-size:17px;font-weight:600;text-transform:capitalize}
.big{margin:14px 0 0;font-size:18px}
.big b{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sub{margin:2px 0 14px;color:var(--mut)}
.bar{position:relative;height:22px;background:var(--line);border-radius:6px;display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.bar u{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);opacity:.8}
.mac{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-top:14px}
.mac .mini{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.mac .mini i{display:block;height:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.meal{margin-top:26px;border-top:1px solid var(--line);padding-top:10px}
.mh{display:flex;justify-content:space-between;align-items:baseline}
.mh span{color:var(--mut)}
.ent{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ent small{display:block;color:var(--mut)}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--mut);padding:2px 8px}
.add{background:none;border:0;color:var(--acc);font-weight:600;padding:10px 0 0}
#wt{margin-top:30px;border-top:1px solid var(--line);padding-top:12px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.row input{width:auto;flex:1;min-width:90px}
label{display:block;font-size:14px;color:var(--mut);margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fine{color:var(--mut);font-size:14px;margin-top:30px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);width:min(520px,calc(100% - 24px));max-height:86vh;padding:18px}
dialog::backdrop{background:rgba(10,20,25,.55)}
#res{margin-top:8px;max-height:38vh;overflow:auto}
#res button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px}
#res button span{color:var(--mut)}
.pk{margin-top:12px;padding:12px;border:1px solid var(--acc);border-radius:10px}
textarea{height:140px;font-size:13px}
.ent .ed{background:none;border:0;padding:0;text-align:left;width:100%}
.rw{display:flex;gap:18px;flex-wrap:wrap}
#wk{margin-top:30px;border-top:1px solid var(--line);padding-top:12px}
#vw{border-radius:8px;overflow:hidden;background:#000;min-height:120px}
#vw video{width:100%;display:block}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<main>
<header><h1>Bilanz</h1><button class="ghost" id="cfg">Ziele</button><button class="ghost" id="bak">Daten</button></header>
<nav class="dn"><button id="prev" aria-label="Vorheriger Tag">‹</button><button id="today"></button><button id="next" aria-label="Nächster Tag">›</button></nav>
<section id="sum"></section>
<section id="meals"></section>
<section id="wk"></section>
<section id="wt"></section>
<p class="fine">Alle Einträge bleiben in diesem Browser. Kein Konto, kein Abo, keine Zusatzpakete. Nährwerte sind gerundete Richtwerte pro 100 g. Online-Produktdaten stammen von Open Food Facts (ODbL), werden von der Community gepflegt und sind nicht immer vollständig.</p>
</main>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s), dlg=$('#dlg');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r0=Math.round, r1=x=>Math.round(x*10)/10, nf=new Intl.NumberFormat('de-DE',{maximumFractionDigits:1});
const KEY='bilanz-v1';
const M=[['f','Frühstück'],['m','Mittagessen'],['a','Abendessen'],['s','Snacks']];
const FOODS=`Haferflocken|372|13.5|58.7|7
Magerquark|67|12|4|0.3
Skyr|63|11|4|0.2
Griechischer Joghurt (10 %)|133|5.5|4|10
Joghurt 3,5 %|66|3.5|4.7|3.5
Milch 1,5 %|47|3.4|4.9|1.5
Hafermilch|45|0.5|7|1.5
Hühnerei|137|12.5|0.7|9.7
Hähnchenbrust|106|23|0|1.2
Rinderhack (mager)|150|20|0|8
Lachs|202|20|0|13
Thunfisch (Dose, im eigenen Saft)|110|25|0|1
Tofu|120|13|1|7
Reis (gekocht)|130|2.7|28|0.3
Nudeln (gekocht)|158|5.8|31|0.9
Kartoffeln (gekocht)|71|2|15|0.1
Linsen (gekocht)|116|9|20|0.4
Kichererbsen (gekocht)|139|8|20|2.6
Vollkornbrot|210|7.5|38|1.5
Brötchen|270|9|53|1.5
Cornflakes|375|7|83|0.9
Banane|93|1|20|0.2
Apfel|54|0.3|12|0.4
Beeren (gemischt)|45|1|8|0.4
Brokkoli|34|3.7|2.7|0.4
Tomate|18|0.9|2.6|0.2
Gurke|12|0.6|1.8|0.2
Paprika|28|1|5|0.3
Spinat|23|2.6|0.6|0.4
Gouda|356|25|0|28
Mozzarella|240|18|1|18
Butter|741|0.7|0.6|83
Olivenöl|884|0|0|100
Erdnussbutter|600|25|12|50
Mandeln|580|21|10|52
Honig|304|0.4|75|0
Whey-Protein|380|78|6|6
Schokolade (Vollmilch)|540|7|57|31
Pizza (Tiefkühl)|240|10|30|8
Bier (pro 100 ml)|43|0.5|3.6|0
Kaffee (schwarz)|2|0.2|0|0`.split('\n').map(l=>{const a=l.split('|');return{n:a[0],k:+a[1],p:+a[2],c:+a[3],f:+a[4]}});

let S,cur,ctx={};
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||!S.goals)S={goals:{k:2400,p:150,c:260,f:75},days:{},custom:[],weights:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function shift(n){const d=new Date(cur+'T12:00:00');d.setDate(d.getDate()+n);cur=iso(d);render()}
function dayOf(k){const d=S.days[k]||(S.days[k]={});M.forEach(([i])=>d[i]=d[i]||[]);return d}

function render(){
 const d=S.days[cur]||{},G=S.goals,t={k:0,p:0,c:0,f:0};
 M.forEach(([i])=>(d[i]||[]).forEach(e=>{t.k+=e.k;t.p+=e.p;t.c+=e.c;t.f+=e.f}));
 const isToday=cur===iso(new Date());
 $('#today').textContent=isToday?'Heute':new Date(cur+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
 const rem=G.k-t.k, track=Math.max(G.k,t.k,1), ms=t.p*4+t.c*4+t.f*9||1, sc=t.k/track*100/ms;
 const mac=(lab,v,g,col)=>`<div class="mac"><span><i class="dot" style="background:var(${col})"></i>${lab}</span><span>${r0(v)} von ${g} g</span><div class="mini"><i style="width:${Math.min(100,g?v/g*100:0)}%;background:var(${col})"></i></div></div>`;
 $('#sum').innerHTML=`<p class="big"><b>${nf.format(Math.abs(r0(rem)))}</b> kcal ${rem>=0?'übrig':'über dem Ziel'}</p>
 <p class="sub">${nf.format(r0(t.k))} von ${nf.format(G.k)} kcal gegessen</p>
 <div class="bar" role="img" aria-label="Kalorien nach Makronährstoffen"><i style="width:${t.p*4*sc}%;background:var(--p)"></i><i style="width:${t.c*4*sc}%;background:var(--c)"></i><i style="width:${t.f*9*sc}%;background:var(--f)"></i><u style="left:calc(${G.k/track*100}% - 3px);${t.k>G.k?'':'display:none'}"></u></div>
 ${mac('Protein',t.p,G.p,'--p')}${mac('Kohlenhydrate',t.c,G.c,'--c')}${mac('Fett',t.f,G.f,'--f')}`;
 $('#meals').innerHTML=M.map(([id,lab])=>{const L=d[id]||[];
  return `<div class="meal"><div class="mh"><h2>${lab}</h2><span>${r0(L.reduce((a,e)=>a+e.k,0))} kcal</span></div>`+
  L.map((e,i)=>`<div class="ent"><button class="ed" data-edit="${id}:${i}" aria-label="Menge von ${esc(e.n)} ändern"><b>${esc(e.n)}</b><small>${e.g} g, P ${r0(e.p)} / K ${r0(e.c)} / F ${r0(e.f)}</small></button><span>${r0(e.k)}</span><button class="x" data-del="${id}:${i}" aria-label="${esc(e.n)} entfernen">×</button></div>`).join('')+
  `<div class="rw"><button class="add" data-add="${id}">Hinzufügen</button><button class="add" data-copy="${id}">Von gestern übernehmen</button></div></div>`}).join('');
 renderWeek();renderWeight();
}

function renderWeek(){
 const G=S.goals.k,days=[],base=new Date(cur+'T12:00:00');
 for(let i=6;i>=0;i--){const d=new Date(base);d.setDate(d.getDate()-i);const o=S.days[iso(d)]||{};let k=0;M.forEach(([m])=>(o[m]||[]).forEach(e=>k+=e.k));days.push({k,l:d.toLocaleDateString('de-DE',{weekday:'short'}).slice(0,2),cur:i===0})}
 const mx=Math.max(G*1.25,...days.map(d=>d.k),1),logged=days.filter(d=>d.k>0),gy=58-G/mx*52;
 const bars=days.map((d,i)=>{const h=d.k/mx*52;return `<rect x="${i*43+6}" y="${58-h}" width="30" height="${h}" rx="3" fill="${d.k>G*1.05?'var(--c)':'var(--acc)'}" opacity="${d.cur?1:.55}"/><text x="${i*43+21}" y="70" text-anchor="middle" font-size="10" fill="var(--mut)">${d.l}</text>`}).join('');
 $('#wk').innerHTML=`<h2>Letzte 7 Tage</h2><svg viewBox="0 0 300 74" width="100%" role="img" aria-label="Kalorien der letzten sieben Tage">${bars}<line x1="0" x2="300" y1="${gy}" y2="${gy}" stroke="var(--ink)" stroke-dasharray="3 3" opacity=".5"/></svg><p class="sub">${logged.length?'Durchschnitt '+nf.format(r0(logged.reduce((a,d)=>a+d.k,0)/logged.length))+' kcal an '+logged.length+' Tagen mit Einträgen':'Noch keine Einträge in dieser Woche'}</p>`;
}

function renderWeight(){
 const ks=Object.keys(S.weights).sort(), last=ks.slice(-30), cw=S.weights[cur];
 let svg='';
 if(last.length>1){const v=last.map(k=>S.weights[k]),mn=Math.min(...v),mx=Math.max(...v),h=mx-mn||1;
  const pts=v.map((x,i)=>`${(i/(v.length-1)*300).toFixed(1)},${(56-(x-mn)/h*50).toFixed(1)}`).join(' ');
  svg=`<svg viewBox="0 0 300 60" width="100%" height="60" role="img" aria-label="Gewichtsverlauf"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/></svg>
  <p class="sub">${nf.format(v[0])} kg am ${new Date(last[0]+'T12:00:00').toLocaleDateString('de-DE')} → ${nf.format(v[v.length-1])} kg (${v[v.length-1]-v[0]>0?'+':''}${nf.format(r1(v[v.length-1]-v[0]))} kg)</p>`}
 $('#wt').innerHTML=`<h2>Gewicht</h2><div class="row"><input id="wi" type="number" inputmode="decimal" step="0.1" placeholder="kg" value="${cw||''}" aria-label="Gewicht in kg"><button class="pri" id="ws">Speichern</button></div>${svg}`;
}

function openDlg(h){dlg.innerHTML=h;if(!dlg.open)dlg.showModal()}
function openAdd(m){
 ctx={m,sel:null};
 openDlg(`<h2>${M.find(x=>x[0]===m)[1]}</h2><div class="row"><input id="q" type="search" placeholder="Lebensmittel suchen" autocomplete="off" aria-label="Lebensmittel suchen"></div><div id="res"></div><div id="pk"></div>
 <div class="row"><button class="pri" id="sc">Barcode scannen</button><button class="ghost" id="ol">Online suchen</button><button class="ghost" id="nf">Eigenes anlegen</button><button class="ghost" data-close style="margin-left:auto">Schließen</button></div>`);
 list('');$('#q').focus();
}
function all(){return [...S.custom,...FOODS]}
function list(q){
 q=q.toLowerCase().trim();let a=all();
 if(q)a=a.filter(f=>f.n.toLowerCase().includes(q)).sort((x,y)=>y.n.toLowerCase().startsWith(q)-x.n.toLowerCase().startsWith(q));
 else{const r=S.recent||[];a=[...r,...a.filter(f=>!r.some(x=>x.n===f.n))]}
 ctx.list=a.slice(0,40);
 $('#res').innerHTML=ctx.list.length?ctx.list.map((f,i)=>`<button data-pick="${i}">${esc(f.n)}<span>${f.k} kcal</span></button>`).join(''):'<p class="sub">Nichts gefunden. Lege es mit „Eigenes anlegen“ an.</p>';
}
function pick(f){
 ctx.sel=f;
 $('#pk').innerHTML=`<div class="pk"><b>${esc(f.n)}</b><small style="display:block;color:var(--mut)">pro 100 g: ${f.k} kcal, P ${f.p} / K ${f.c} / F ${f.f}</small>
 <label for="gr">Menge in Gramm</label><input id="gr" type="number" inputmode="decimal" value="100" min="1"><p class="sub" id="pv"></p><button class="pri" id="ok">Zum Tag hinzufügen</button></div>`;
 const pv=()=>{const g=+$('#gr').value||0;$('#pv').textContent=r0(f.k*g/100)+' kcal'};
 $('#gr').addEventListener('input',pv);pv();$('#gr').select();
}
function newFood(){
 $('#pk').innerHTML=`<div class="pk"><b>Eigenes Lebensmittel (Werte pro 100 g)</b>
 <label for="nn">Name</label><input id="nn" type="text"><div class="g2"><div><label for="nk">kcal</label><input id="nk" type="number" inputmode="decimal"></div><div><label for="np">Protein g</label><input id="np" type="number" inputmode="decimal"></div><div><label for="nc">Kohlenhydrate g</label><input id="nc" type="number" inputmode="decimal"></div><div><label for="nfa">Fett g</label><input id="nfa" type="number" inputmode="decimal"></div></div>
 <div class="row"><button class="pri" id="sf">Speichern und auswählen</button></div></div>`;
 $('#nn').focus();
}

function openGoals(){
 const G=S.goals;
 openDlg(`<h2>Tagesziele</h2><div class="g2"><div><label for="gk">kcal</label><input id="gk" type="number" value="${G.k}"></div><div><label for="gp">Protein g</label><input id="gp" type="number" value="${G.p}"></div><div><label for="gc">Kohlenhydrate g</label><input id="gc" type="number" value="${G.c}"></div><div><label for="gf">Fett g</label><input id="gf" type="number" value="${G.f}"></div></div>
 <div class="row"><button class="pri" id="sg">Ziele speichern</button></div>
 <h2 style="margin-top:22px">Ziele berechnen</h2>
 <div class="g2"><div><label for="cs">Geschlecht</label><select id="cs"><option value="m">männlich</option><option value="w">weiblich</option></select></div><div><label for="ca">Alter</label><input id="ca" type="number" value="30"></div><div><label for="ch">Größe in cm</label><input id="ch" type="number" value="178"></div><div><label for="cw">Gewicht in kg</label><input id="cw" type="number" step="0.1" value="${S.weights[Object.keys(S.weights).sort().pop()]||75}"></div>
 <div><label for="cl">Aktivität</label><select id="cl"><option value="1.2">kaum Bewegung</option><option value="1.375">leicht aktiv</option><option value="1.55" selected>mäßig aktiv</option><option value="1.725">sehr aktiv</option></select></div><div><label for="cz">Ziel</label><select id="cz"><option value="-500">Abnehmen</option><option value="0" selected>Gewicht halten</option><option value="300">Aufbauen</option></select></div></div>
 <div class="row"><button class="ghost" id="calc">Werte einsetzen</button><button class="ghost" data-close style="margin-left:auto">Schließen</button></div>`);
}
function calc(){
 const w=+$('#cw').value,h=+$('#ch').value,a=+$('#ca').value,m=$('#cs').value==='m';
 const bmr=10*w+6.25*h-5*a+(m?5:-161),k=r0(bmr*$('#cl').value+ +$('#cz').value),z=+$('#cz').value;
 const p=r0(w*(z===0?1.6:2)),f=r0(w*0.9),c=Math.max(0,r0((k-p*4-f*9)/4));
 $('#gk').value=k;$('#gp').value=p;$('#gf').value=f;$('#gc').value=c;
}
function openBackup(){
 openDlg(`<h2>Daten</h2><p class="sub">Kopiere den Text zum Sichern. Zum Wiederherstellen einen gesicherten Text einfügen und importieren.</p><textarea id="bt" aria-label="Datensicherung">${esc(JSON.stringify(S))}</textarea>
 <div class="row"><button class="pri" id="imp">Importieren</button><button class="ghost" id="wipe">Alles löschen</button><button class="ghost" data-close style="margin-left:auto">Schließen</button></div><p class="sub" id="bm"></p>`);
}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.close!==undefined)dlg.close();
 else if(b.id==='prev')shift(-1);else if(b.id==='next')shift(1);
 else if(b.id==='today'){cur=iso(new Date());render()}
 else if(b.id==='cfg')openGoals();else if(b.id==='bak')openBackup();
 else if(b.dataset.add)openAdd(b.dataset.add);
 else if(b.dataset.del){const[i,n]=b.dataset.del.split(':');dayOf(cur)[i].splice(+n,1);save();render()}
 else if(b.dataset.pick)pick(ctx.list[+b.dataset.pick]);
 else if(b.id==='nf')newFood();
 else if(b.id==='sf'){const n=$('#nn').value.trim(),k=+$('#nk').value;if(!n||!(k>=0)||$('#nk').value===''){$('#nn').focus();return}
  const f={n,k,p:+$('#np').value||0,c:+$('#nc').value||0,f:+$('#nfa').value||0};S.custom.unshift(f);save();list($('#q').value);pick(f)}
 else if(b.id==='ok'){const g=+$('#gr').value,f=ctx.sel;if(!(g>0))return;
  dayOf(cur)[ctx.m].push({n:f.n,g,k:r1(f.k*g/100),p:r1(f.p*g/100),c:r1(f.c*g/100),f:r1(f.f*g/100)});if(f.code)(S.cache=S.cache||{})[f.code]=f;S.recent=[f,...(S.recent||[]).filter(x=>x.n!==f.n)].slice(0,12);save();dlg.close();render()}
 else if(b.id==='sg'){S.goals={k:+$('#gk').value||0,p:+$('#gp').value||0,c:+$('#gc').value||0,f:+$('#gf').value||0};save();dlg.close();render()}
 else if(b.id==='calc')calc();
 else if(b.id==='sc')scan();
 else if(b.id==='ol')onlineSearch();
 else if(b.id==='stop'){stopScan();$('#pk').innerHTML=''}
 else if(b.id==='bs')lookup($('#bc').value);
 else if(b.dataset.edit){const[i,n]=b.dataset.edit.split(':'),e=dayOf(cur)[i][+n];ctx.ed={i,n:+n};
  openDlg(`<h2>${esc(e.n)}</h2><label for="eg">Menge in Gramm</label><input id="eg" type="number" inputmode="decimal" value="${e.g}" min="1"><div class="row"><button class="pri" id="es">Speichern</button><button class="ghost" data-close style="margin-left:auto">Abbrechen</button></div>`);$('#eg').select()}
 else if(b.id==='es'){const g=+$('#eg').value;if(!(g>0))return;const e=dayOf(cur)[ctx.ed.i][ctx.ed.n],x=g/e.g;Object.assign(e,{g,k:r1(e.k*x),p:r1(e.p*x),c:r1(e.c*x),f:r1(e.f*x)});save();dlg.close();render()}
 else if(b.dataset.copy){const p=new Date(cur+'T12:00:00');p.setDate(p.getDate()-1);const src=(S.days[iso(p)]||{})[b.dataset.copy]||[];if(src.length){dayOf(cur)[b.dataset.copy].push(...src.map(e=>({...e})));save();render()}}
 else if(b.id==='ws'){const v=parseFloat($('#wi').value.replace(',','.'));if(v>0){S.weights[cur]=v}else{delete S.weights[cur]}save();renderWeight()}
 else if(b.id==='imp'){try{const x=JSON.parse($('#bt').value);if(!x.goals||!x.days)throw 0;S=x;save();dlg.close();render()}catch(err){$('#bm').textContent='Der Text ist keine gültige Sicherung.'}}
 else if(b.id==='wipe'){if(b.dataset.sure){S=null;try{localStorage.removeItem(KEY)}catch(err){}load();dlg.close();render()}else{b.dataset.sure=1;b.textContent='Wirklich alles löschen?'}}
});

const OFF='https://world.openfoodfacts.org';
const OFFQ='fields=code,product_name,brands,nutriments';
const H5='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
let stream=null,scanOn=false,h5=null;
function stopScan(){scanOn=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 if(h5){const h=h5;h5=null;h.stop().then(()=>h.clear()).catch(()=>{})}}
function loadScript(src){return new Promise((ok,no)=>{if(window.Html5Qrcode)return ok();const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)})}
function toFood(p){
 const n=p.nutriments||{};let k=n['energy-kcal_100g'];
 if(k==null&&n.energy_100g!=null)k=n.energy_100g/4.184;
 if(k==null||!p.product_name)return null;
 return{n:p.product_name+(p.brands?' ('+p.brands.split(',')[0].trim()+')':''),k:r0(k),p:r1(+n.proteins_100g||0),c:r1(+n.carbohydrates_100g||0),f:r1(+n.fat_100g||0),code:p.code}}
async function lookup(code){
 code=String(code).replace(/\D/g,'');
 if(code.length<8){$('#pk').innerHTML='<p class="sub">Bitte einen gültigen Barcode eingeben (8 bis 13 Ziffern).</p>';return}
 const hit=(S.cache||{})[code];if(hit){pick(hit);return}
 $('#pk').innerHTML='<p class="sub">Suche in Open Food Facts …</p>';
 try{
  const r=await fetch(`${OFF}/api/v2/product/${code}.json?${OFFQ}`);
  const j=await r.json();
  const f=j.status===1&&j.product?toFood(j.product):null;
  if(!f){$('#pk').innerHTML='<p class="sub">Produkt nicht gefunden oder ohne Nährwerte. Lege es mit „Eigenes anlegen“ an.</p>';return}
  (S.cache=S.cache||{})[code]=f;save();pick(f);
 }catch(err){$('#pk').innerHTML='<p class="sub">Keine Verbindung zu Open Food Facts. Gescannte Produkte sind nach dem ersten Abruf auch offline verfügbar.</p>'}
}
async function onlineSearch(){
 const q=$('#q').value.trim();if(q.length<2){$('#q').focus();return}
 $('#res').innerHTML='<p class="sub">Suche online …</p>';
 try{
  const r=await fetch(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=15&${OFFQ}`);
  const j=await r.json();
  ctx.list=(j.products||[]).map(toFood).filter(Boolean);
  $('#res').innerHTML=ctx.list.length?ctx.list.map((f,i)=>`<button data-pick="${i}">${esc(f.n)}<span>${f.k} kcal</span></button>`).join(''):'<p class="sub">Online nichts gefunden.</p>';
 }catch(err){$('#res').innerHTML='<p class="sub">Keine Verbindung zu Open Food Facts.</p>'}
}
async function scan(){
 stopScan();
 $('#pk').innerHTML=`<div class="pk"><div id="vw"><video id="vd" playsinline muted></video></div><p class="sub" id="sm">Halte den Barcode ins Bild.</p>
 <div class="row"><input id="bc" type="text" inputmode="numeric" placeholder="Oder Barcode eintippen" aria-label="Barcode"><button class="ghost" id="bs">Suchen</button></div>
 <div class="row"><button class="ghost" id="stop">Abbrechen</button></div></div>`;
 try{
  if('BarcodeDetector' in window){
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
   const v=$('#vd');v.srcObject=stream;await v.play();
   const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});scanOn=true;
   const tick=async()=>{if(!scanOn)return;
    try{const r=await det.detect(v);if(r.length){stopScan();lookup(r[0].rawValue);return}}catch(e){}
    requestAnimationFrame(tick)};
   tick();
  }else{
   await loadScript(H5);
   $('#vw').innerHTML='';
   h5=new Html5Qrcode('vw');
   const F=Html5QrcodeSupportedFormats;
   await h5.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150},formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E]},code=>{stopScan();lookup(code)},()=>{});
  }
 }catch(err){const m=$('#sm');if(m)m.textContent='Kamera nicht verfügbar oder nicht erlaubt. Du kannst den Code unten eintippen.'}
}
dlg.addEventListener('close',stopScan);
document.addEventListener('input',e=>{if(e.target.id==='q')list(e.target.value)});
dlg.addEventListener('click',e=>{if(e.target!==dlg)return;const r=dlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dlg.close()});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;
 if(id==='q'&&ctx.list&&ctx.list[0]){e.preventDefault();pick(ctx.list[0])}
 else if(id==='gr')$('#ok').click();else if(id==='bc')$('#bs').click();else if(id==='eg')$('#es').click()});
load();cur=iso(new Date());render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
